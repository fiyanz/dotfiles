general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/share/lock-wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
    color = rgb(17, 17, 17)
}

label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 96
    font_family = Noto Sans Mono
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d %B %Y'
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = Noto Sans Mono
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(17, 17, 17, 0.8)
    outer_color = rgb(85, 85, 85)
    check_color = rgb(255, 255, 255)
    fail_color = rgb(224, 96, 96)
    capslock_color = rgb(224, 192, 96)
    font_color = rgb(255, 255, 255)
    font_family = Noto Sans Mono
    placeholder_text = Password
    fail_text = Wrong password ($ATTEMPTS)
    fade_on_empty = false
    rounding = 12
    position = 0, -20
    halign = center
    valign = center
}
